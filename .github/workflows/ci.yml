name: Zugang und Sitzungen prüfen
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  link-generator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -v
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/check-contract.sh
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./backend/mvnw -B -f backend/pom.xml verify '-Dit.test=*IT,!ApiVersionStateIT,!ApiRetirementIT,!ReleaseTransitionIT,!AdministrativeSerializationIT'
  backend-retirement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./backend/mvnw -B -f backend/pom.xml verify -Dit.test=ApiVersionStateIT,ApiRetirementIT,ReleaseTransitionIT,AdministrativeSerializationIT
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-stilllegung-fehler
          path: |
            backend/target/failsafe-reports
            /tmp/tnbp-release-it-*/*.log
  browser-transition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run e2e:transition
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-uebergang-fehler
          path: frontend/test-results
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-fehler
          path: frontend/test-results
