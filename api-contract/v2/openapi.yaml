openapi: 3.0.4
info:
  title: Try Not to Be Poor API v2
  version: 2.0.0
  description: Versionierter Kontozugang mit denselben Konten und Refresh-Familien wie v1. Registrierung erzeugt
    keine Sitzung. Unbestätigte Mutationen niemals automatisch wiederholen.
servers:
- url: /api/v2
paths:
  /access/registrations:
    post:
      tags:
      - Access
      operationId: register
      summary: Eigenes Konto über einen aktiven Registrierungslink anlegen
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Das Konto wurde verbindlich gespeichert; keine Sitzung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCreated'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          description: Feldfehler oder neutraler Registrierungsfehler ohne Kontobestätigung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '415':
          description: Nicht unterstützter Content-Type; keine Kontoanlage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '500':
          description: Speicherung fehlgeschlagen. Es wird kein Erfolg bestätigt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
  /access/csrf:
    get:
      tags:
      - Sessions
      operationId: sessionCsrf
      security: []
      summary: CSRF-Token nur für den Arbeitsspeicher des Tabs beziehen
      responses:
        '200':
          description: no-store; setzt ein hostgebundenes HttpOnly Secure SameSite=Strict CSRF-Sitzungscookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: __Host-tnbp-csrf; HttpOnly; Secure; SameSite=Strict; Path=/; keine Domain. Speichert
                ausschließlich CSRF-Zustand, keine Anmeldung.
              schema:
                type: string
  /access/login:
    post:
      tags:
      - Sessions
      operationId: login
      security: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '403':
          $ref: '#/components/responses/SessionForbidden'
        '500':
          $ref: '#/components/responses/SessionUnavailable'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /access/refresh:
    post:
      tags:
      - Sessions
      operationId: refreshSession
      security:
      - RefreshCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '403':
          $ref: '#/components/responses/SessionForbidden'
        '500':
          $ref: '#/components/responses/SessionUnavailable'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /access/logout:
    post:
      tags:
      - Sessions
      operationId: logoutSession
      description: Das Refresh-Cookie ist optional. Eine bekannte Familie wird nach Commit widerrufen;
        auch ohne oder mit unbekanntem Refresh-Cookie erfolgt idempotent 204 und das Cookie wird gelöscht.
        Der passende CSRF-Cookie-/Headerkontext und die exakte Origin bleiben erforderlich.
      security:
      - {}
      - RefreshCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Bekannte Familie widerrufen und Cookie gelöscht; auch ohne oder mit unbekanntem Refresh-Cookie.
            Vorhandene Access-JWTs laufen regulär ab. no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
        '403':
          $ref: '#/components/responses/SessionForbidden'
        '500':
          $ref: '#/components/responses/SessionUnavailable'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /access/me:
    get:
      tags:
      - Sessions
      operationId: sessionIdentity
      security:
      - AccessBearer: []
      responses:
        '200':
          description: Identität ausschließlich aus verifiziertem JWT-sub; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIdentity'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/SessionRejected'
  /expenses:
    get:
      tags: [Expenses]
      operationId: getExpenses
      summary: Eigene vollständige Ausgabenhistorie nach Datum absteigend, dann ID lesen
      security:
        - AccessBearer: []
      responses:
        '200':
          description: Alle eigenen Monate; no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '500':
          $ref: '#/components/responses/ExpenseUnavailable'
    post:
      tags: [Expenses]
      operationId: postExpense
      summary: Eine eigene Ausgabe am aktuellen Kalendertag erfassen
      description: Ausschließlich geprüftes Bearer-sub bestimmt den Eigentümer. Monatssummen über der sicheren Centgrenze werden atomar abgelehnt. Erfolg erst nach Commit.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
      responses:
        '201':
          description: Verbindlich gespeichert; no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          description: Feldfehler oder sichere Monatssumme überschritten; keine Mutation, no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseError'
        '415':
          $ref: '#/components/responses/ExpenseUnsupportedMediaType'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '500':
          $ref: '#/components/responses/ExpenseUnavailable'
  /expenses/{expenseId}:
    parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Expenses]
      operationId: putExpense
      summary: Name und Betrag einer eigenen Ausgabe ändern
      description: ID, Eigentümer und ursprüngliches Kalenderdatum bleiben unverändert. Ersatzsumme im ursprünglichen Monat atomar prüfen; Erfolg erst nach Commit. Ausschließlich geprüftes Bearer-sub bestimmt den Eigentümer.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
      responses:
        '200':
          description: Verbindlich geändert; no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          description: Ungültige Eingabe oder sichere Monatssumme überschritten; keine Mutation, no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseError'
        '415':
          $ref: '#/components/responses/ExpenseUnsupportedMediaType'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '404':
          $ref: '#/components/responses/ExpenseNotFound'
        '500':
          $ref: '#/components/responses/ExpenseUnavailable'
    delete:
      tags: [Expenses]
      operationId: deleteExpense
      summary: Eine eigene Ausgabe endgültig löschen
      description: Ausschließlich geprüftes Bearer-sub bestimmt den Eigentümer. Erfolg erst nach Commit.
      security:
        - AccessBearer: []
      responses:
        '204':
          description: Verbindlich gelöscht; leerer Antwortkörper, no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '404':
          $ref: '#/components/responses/ExpenseNotFound'
        '500':
          $ref: '#/components/responses/ExpenseUnavailable'
  /budget:
    get:
      tags: [Budget]
      operationId: getBudget
      summary: Eigenes fortlaufendes Budget für den aktuellen Berlin-Kalendermonat lesen
      security:
        - AccessBearer: []
      responses:
        '200':
          description: no-store; null bedeutet noch kein Budget, 0 ein gesetztes Nullbudget.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponse'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '500':
          $ref: '#/components/responses/BudgetUnavailable'
    put:
      tags: [Budget]
      operationId: putBudget
      summary: Eigenes Budget ab aktuellem Berlin-Monat fortlaufend festlegen oder ändern
      description: Ausschließlich Bearer-Authentifizierung; Cookies bestimmen weder Zugang noch Eigentümer. Frühere Monate bleiben erhalten. Keine Budgetlöschung.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetRequest'
      responses:
        '200':
          description: Erst nach Commit bestätigt; no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponse'
        '400':
          description: Ungültige Eingabe, unveränderter Bestand; no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetError'
        '415':
          $ref: '#/components/responses/BudgetUnsupportedMediaType'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '500':
          $ref: '#/components/responses/BudgetUnavailable'
  /month-summary:
    get:
      tags: [MonthSummary]
      operationId: getMonthSummary
      summary: Eigenes Budget und Ausgaben des aktuellen Berlin-Monats aus einem Datenbanksnapshot lesen
      security:
        - AccessBearer: []
      responses:
        '200':
          description: no-store; fehlendes Budget und Rest sind null, ein Nullbudget ist numerisch.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Date:
              description: Verbindliche HTTP-Serverzeit im RFC-1123-Format (GMT). Der Browser verwendet sie mit der seit Empfang monoton verstrichenen Zeit zur Erkennung eines Monatswechsels, unabhängig von seiner Geräteuhr.
              required: true
              schema:
                type: string
                example: Tue, 27 Oct 2026 13:00:00 GMT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthSummaryResponse'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '500':
          description: Monatsübersicht nicht geladen; neutraler Fehler, no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthSummaryError'
  /savings-goals:
    get:
      tags: [SavingsGoals]
      operationId: getSavingsGoals
      summary: Eigene Sparziele stabil nach ID sortiert lesen
      security:
        - AccessBearer: []
      responses:
        '200':
          description: Eigene Ziele; no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavingsGoalResponse'
        '400':
          $ref: '#/components/responses/SavingsGoalInvalid'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '500':
          $ref: '#/components/responses/SavingsGoalUnavailable'
    post:
      tags: [SavingsGoals]
      operationId: postSavingsGoal
      summary: Ein eigenes Sparziel mit null Cent Fortschritt anlegen
      description: Ausschließlich geprüftes Bearer-sub bestimmt den Eigentümer. Erfolg erst nach Commit. Zieldatum bleibt ein unverändertes Kalenderdatum, auch vergangene Daten sind zulässig.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsGoalRequest'
      responses:
        '201':
          description: Verbindlich gespeichert; no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoalResponse'
        '400':
          $ref: '#/components/responses/SavingsGoalInvalid'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '415':
          $ref: '#/components/responses/SavingsGoalUnsupportedMediaType'
        '500':
          $ref: '#/components/responses/SavingsGoalUnavailable'
  /savings-goals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [SavingsGoals]
      operationId: putSavingsGoal
      summary: Editierbare Felder eines eigenen Sparziels ersetzen
      description: Name, Zielbetrag und Datum ersetzen; fehlendes oder null Datum entfernt es. ID, Eigentümer und Fortschritt bleiben erhalten. Erfolg erst nach Commit; no-store.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsGoalRequest'
      responses:
        '200':
          description: Verbindlich ersetzt; no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoalResponse'
        '400':
          $ref: '#/components/responses/SavingsGoalInvalid'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '404':
          $ref: '#/components/responses/SavingsGoalNotFound'
        '415':
          $ref: '#/components/responses/SavingsGoalUnsupportedMediaType'
        '500':
          $ref: '#/components/responses/SavingsGoalUnavailable'
    delete:
      tags: [SavingsGoals]
      operationId: deleteSavingsGoal
      summary: Ein eigenes Sparziel endgültig löschen
      description: Ausschließlich geprüftes Bearer-sub bestimmt den Eigentümer. Erfolg erst nach Commit; no-store.
      security:
        - AccessBearer: []
      responses:
        '204':
          description: Verbindlich gelöscht; leerer Antwortkörper; no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/SavingsGoalInvalid'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '404':
          $ref: '#/components/responses/SavingsGoalNotFound'
        '500':
          $ref: '#/components/responses/SavingsGoalUnavailable'
  /savings-goals/{id}/progress:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [SavingsGoals]
      operationId: putSavingsGoalProgress
      summary: Gesamtfortschritt eines eigenen Sparziels ersetzen
      description: Idempotenter Ersatz in signierten ganzen EUR-Cent; übrige Zielfelder bleiben unverändert. Negative Werte bleiben mit 409 FEATURE_NOT_AVAILABLE gesperrt, bis alle v1-Lese- und Schreibvorgänge einschließlich Datenbankarbeit nachweislich beendet sind. Kein Konfigurationsschalter ersetzt diese Versionsbarriere. Ausschließlich geprüftes Bearer-sub bestimmt den Eigentümer. Erfolg erst nach Commit.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsGoalProgressRequest'
      responses:
        '200':
          description: Verbindlich ersetzt; no-store.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoalResponse'
        '400':
          $ref: '#/components/responses/SavingsGoalInvalid'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '404':
          $ref: '#/components/responses/SavingsGoalNotFound'
        '415':
          $ref: '#/components/responses/SavingsGoalUnsupportedMediaType'
        '409':
          $ref: '#/components/responses/SavingsGoalFeatureNotAvailable'
        '500':
          $ref: '#/components/responses/SavingsGoalUnavailable'
components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Vollständig geprüftes HS256-JWT: Signatur, Aussteller, Zielgruppe, iat, nbf, exklusives exp
        und kanonischer UUID-sub. Gültigkeit zehn Minuten; nur im Arbeitsspeicher. Cookies ersetzen kein Bearer-JWT.'
    RefreshCookie:
      type: apiKey
      in: cookie
      name: __Host-tnbp-refresh
      description: 256 Zufallsbits, HttpOnly; Secure; SameSite=Strict; Path=/; kein Domain. Jede Erneuerung rotiert.
        30 Tage inaktiv / 90 Tage seit Anmeldung, Grenzen exklusiv.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Muss exakt der extern konfigurierten HTTPS-SPA-Origin entsprechen.
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: Spring-Security-CSRF-Token aus GET /access/csrf; nur im Arbeitsspeicher halten.
        Erfordert zusätzlich das passende __Host-tnbp-csrf-Sessioncookie aus demselben Handschlag;
        Header und Cookie müssen gemeinsam gesendet werden.
  headers:
    NoStore:
      description: Persönliche Antworten und Fehler niemals zwischenspeichern.
      schema:
        type: string
        enum:
        - no-store
    RefreshCookie:
      description: __Host-tnbp-refresh; HttpOnly; Secure; SameSite=Strict; Path=/; keine Domain. Rotation nach Commit,
        Max-Age höchstens 30 Tage Inaktivität und 90 Tage seit Anmeldung (exklusive Grenzen). Löschung mit Max-Age=0.
      schema:
        type: string
  responses:
    SessionCreated:
      description: Erst nach Commit; no-store. Set-Cookie rotiert __Host-tnbp-refresh (HttpOnly; Secure; SameSite=Strict;
        Path=/; kein Domain).
      headers:
        Set-Cookie:
          $ref: '#/components/headers/RefreshCookie'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'
    SessionRejected:
      description: Neutraler Fehler; Refreshfehler löschen Cookie. no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionError'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/RefreshCookie'
    SessionForbidden:
      description: CSRF oder Origin fehlt/falsch; keine Mutation. no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionError'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
    SessionUnavailable:
      description: Keine bestätigte Mutation; eine unbestätigte Rotation nicht automatisch wiederholen. no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionError'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
    ExpenseNotFound:
      description: Ausgabe nicht gefunden; identisch für fehlende und fremde IDs, no-store.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseNotFoundError'
    ExpenseUnsupportedMediaType:
      description: Nicht unterstützter Content-Type; keine Mutation. Der Accept-Header nennt application/json.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Accept:
          description: Unterstützter Medientyp für die Anfrage.
          schema:
            type: string
            example: application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseError'
    ExpenseUnavailable:
      description: Speicherung oder Lesen nicht bestätigt; neutraler Fehler, no-store.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseError'
    BudgetUnavailable:
      description: Lesen oder Speicherung nicht bestätigt; neutraler Fehler, no-store. Vor erneuter Mutation aktuellen Stand prüfen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BudgetError'
    BudgetUnsupportedMediaType:
      description: Nicht unterstützter Content-Type; keine Mutation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Accept:
          description: Unterstützter Medientyp für die Anfrage.
          schema:
            type: string
            example: application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BudgetError'
    SavingsGoalInvalid:
      description: Ungültige Eingabe; keine Mutation, no-store.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SavingsGoalError'
    SavingsGoalNotFound:
      description: Sparziel nicht gefunden; identisch für fehlende und fremde IDs, no-store.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SavingsGoalNotFoundError'
    SavingsGoalUnavailable:
      description: Speicherung oder Lesen nicht bestätigt; neutraler Fehler, no-store.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SavingsGoalError'
    SavingsGoalUnsupportedMediaType:
      description: Nicht unterstützter Content-Type; keine Mutation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SavingsGoalError'
    SavingsGoalFeatureNotAvailable:
      description: Gültiger negativer Fortschritt ist bis zur nachgewiesenen vollständigen v1-Lese-/Schreibbarriere gesperrt; keine Mutation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SavingsGoalFeatureNotAvailableError'
  schemas:
    SavingsGoalRequest:
      type: object
      additionalProperties: false
      required: [name, targetAmountCents]
      properties:
        name:
          type: string
          minLength: 1
          description: Wird getrimmt; darf danach nicht leer sein oder NUL enthalten.
        targetAmountCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Positive ganze EUR-Cent; keine Rundung oder Typumwandlung.
        targetDate:
          type: string
          format: date
          nullable: true
          description: Optionales striktes ISO-Kalenderdatum YYYY-MM-DD, Jahr 0001 bis 9999.
    SavingsGoalProgressRequest:
      type: object
      additionalProperties: false
      required: [progressCents]
      properties:
        progressCents:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Neuer Gesamtfortschritt in signierten ganzen EUR-Cent; keine Rundung oder Typumwandlung. Negative Schreibwerte bleiben bis zur nachgewiesenen v1-Barriere mit 409 FEATURE_NOT_AVAILABLE gesperrt.
    SavingsGoalNotFoundError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          enum: [SAVINGS_GOAL_NOT_FOUND]
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    SavingsGoalResponse:
      type: object
      additionalProperties: false
      required: [id, name, targetAmountCents, progressCents]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        targetAmountCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        progressCents:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Tatsächlicher signierter Gesamtfortschritt; neue Ziele beginnen bei 0.
        targetDate:
          type: string
          format: date
          nullable: true
    SavingsGoalError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, SAVINGS_GOAL_UNAVAILABLE]
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    SavingsGoalFeatureNotAvailableError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          enum: [FEATURE_NOT_AVAILABLE]
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    RegistrationRequest:
      type: object
      additionalProperties: false
      required:
      - registrationToken
      - email
      - password
      description: E-Mail wird getrimmt und kleingeschrieben. Passwort wird ausschließlich NFC-normalisiert und
        in Unicode-Codepunkten geprüft (15–64); keine Zeichenklassenpflicht.
      properties:
        registrationToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description: Ungepaddetes Base64url-Geheimnis (256 Bit) aus dem URL-Fragment.
        email:
          type: string
          description: Gültige E-Mail-Syntax, nach Normalisierung höchstens 254 Zeichen.
        password:
          type: string
          writeOnly: true
          description: 15–64 druckbare Unicode-Codepunkte nach NFC; Leerzeichen erlaubt, kein Trimmen oder Abschneiden.
            Lokale Sperrliste.
    RegistrationCreated:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          example: Dein Konto wurde angelegt.
    ApiError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - fieldErrors
      properties:
        code:
          type: string
          enum:
          - VALIDATION_FAILED
          - REGISTRATION_FAILED
          - SERVER_ERROR
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    CsrfResponse:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
          writeOnly: true
    SessionResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - expiresAt
      - userId
      properties:
        accessToken:
          type: string
          description: HS256, externer Schlüssel, exakt zehn Minuten. Nur im Arbeitsspeicher.
        expiresAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
    SessionIdentity:
      type: object
      additionalProperties: false
      required:
      - userId
      properties:
        userId:
          type: string
          format: uuid
    SessionError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - SESSION_REJECTED
          - SESSION_FORBIDDEN
          - SESSION_UNAVAILABLE
        message:
          type: string
    ExpenseNotFoundError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          enum: [EXPENSE_NOT_FOUND]
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    ExpenseRequest:
      type: object
      additionalProperties: false
      required: [name, amountCents]
      properties:
        name:
          type: string
          minLength: 1
          description: Wird getrimmt; darf danach nicht leer sein.
        amountCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Positive ganze EUR-Cent; keine Rundung oder Typumwandlung.
    ExpenseResponse:
      type: object
      additionalProperties: false
      required: [id, name, amountCents, recordedOn]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        amountCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        recordedOn:
          type: string
          format: date
          description: Serverseitiges Kalenderdatum in Europe/Berlin ohne Zeitpunktumrechnung.
    ExpenseError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, MONTH_LIMIT_EXCEEDED, EXPENSE_UNAVAILABLE]
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    BudgetRequest:
      type: object
      additionalProperties: false
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Ganze EUR-Cent; Strings, Bruchteile und Überlauf werden ohne Rundung abgelehnt.
    BudgetResponse:
      type: object
      additionalProperties: false
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9007199254740991
    BudgetError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, BUDGET_UNAVAILABLE]
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    MonthSummaryResponse:
      type: object
      additionalProperties: false
      required: [month, budgetCents, expensesCents, remainingCents]
      properties:
        month:
          type: string
          format: date
          description: Erster Kalendertag des einmalig serverseitig bestimmten Europe/Berlin-Monats.
          pattern: '^(?!0000)\d{4}-(0[1-9]|1[0-2])-01$'
        budgetCents:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9007199254740991
        expensesCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        remainingCents:
          type: integer
          format: int64
          nullable: true
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Exakte Differenz budgetCents minus expensesCents; null genau bei fehlendem Budget.
    MonthSummaryError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [MONTH_SUMMARY_UNAVAILABLE]
        message:
          type: string
