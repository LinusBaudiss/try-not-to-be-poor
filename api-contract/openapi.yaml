openapi: 3.0.4
info:
  title: Try Not to Be Poor API
  version: 1.0.0
  description: Persönliche Kontoanlage, Sitzungen und fortlaufendes Monatsbudget. Eine Registrierung erzeugt keine Sitzung.
servers:
  - url: /api/v1
paths:
  /access/registrations:
    post:
      tags: [Access]
      operationId: register
      summary: Eigenes Konto über einen aktiven Registrierungslink anlegen
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Das Konto wurde verbindlich gespeichert; keine Sitzung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCreated'
        '400':
          description: Feldfehler oder neutraler Registrierungsfehler ohne Kontobestätigung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Speicherung fehlgeschlagen. Es wird kein Erfolg bestätigt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /access/csrf:
    get:
      tags: [Sessions]
      operationId: sessionCsrf
      security: []
      summary: CSRF-Token nur für den Arbeitsspeicher des Tabs beziehen
      responses:
        '200':
          description: no-store; setzt ein hostgebundenes HttpOnly Secure SameSite=Strict CSRF-Sitzungscookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /access/login:
    post:
      tags: [Sessions]
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '403':
          $ref: '#/components/responses/SessionForbidden'
        '500':
          $ref: '#/components/responses/SessionUnavailable'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /access/refresh:
    post:
      tags: [Sessions]
      operationId: refreshSession
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '403':
          $ref: '#/components/responses/SessionForbidden'
        '500':
          $ref: '#/components/responses/SessionUnavailable'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
  /access/logout:
    post:
      tags: [Sessions]
      operationId: logoutSession
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Familie widerrufen und Cookie gelöscht; vorhandene Access-JWTs laufen regulär ab. no-store.
        '403':
          $ref: '#/components/responses/SessionForbidden'
        '500':
          $ref: '#/components/responses/SessionUnavailable'
  /access/me:
    get:
      tags: [Sessions]
      operationId: sessionIdentity
      security:
        - AccessBearer: []
      responses:
        '200':
          description: Identität ausschließlich aus verifiziertem JWT-sub; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIdentity'
        '401':
          $ref: '#/components/responses/SessionRejected'
  /expense-budget/budget:
    get:
      tags: [Budget]
      operationId: getBudget
      summary: Eigenes fortlaufendes Budget für den aktuellen Berlin-Kalendermonat lesen
      security:
        - AccessBearer: []
      responses:
        '200':
          description: no-store; null bedeutet noch kein Budget, 0 ein gesetztes Nullbudget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponse'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '500':
          $ref: '#/components/responses/BudgetUnavailable'
    put:
      tags: [Budget]
      operationId: putBudget
      summary: Eigenes Budget ab aktuellem Berlin-Monat fortlaufend festlegen oder ändern
      description: Ausschließlich Bearer-Authentifizierung; Cookies bestimmen weder Zugang noch Eigentümer. Frühere Monate bleiben erhalten. Keine Budgetlöschung.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetRequest'
      responses:
        '200':
          description: Erst nach Commit bestätigt; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponse'
        '400':
          description: Ungültige Eingabe, unveränderter Bestand; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetError'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '500':
          $ref: '#/components/responses/BudgetUnavailable'
  /expense-budget/expenses:
    get:
      tags: [Expenses]
      operationId: getExpenses
      summary: Eigene vollständige Ausgabenhistorie nach Datum absteigend, dann ID lesen
      security:
        - AccessBearer: []
      responses:
        '200':
          description: Alle eigenen Monate; no-store.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '500':
          $ref: '#/components/responses/ExpenseUnavailable'
    post:
      tags: [Expenses]
      operationId: postExpense
      summary: Eine eigene Ausgabe am aktuellen Berlin-Kalendertag erfassen
      description: Ausschließlich geprüftes Bearer-sub bestimmt den Eigentümer. Monatssummen über der sicheren Centgrenze werden atomar abgelehnt. Erfolg erst nach Commit.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
      responses:
        '201':
          description: Verbindlich gespeichert; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          description: Feldfehler oder sichere Monatssumme überschritten; keine Mutation, no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseError'
        '401':
          $ref: '#/components/responses/SessionRejected'
        '500':
          $ref: '#/components/responses/ExpenseUnavailable'
components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: __Host-tnbp-refresh
      description: 256 Zufallsbits, HttpOnly; Secure; SameSite=Strict; Path=/; kein Domain. Jede Erneuerung rotiert. 30 Tage inaktiv / 90 Tage seit Anmeldung, Grenzen exklusiv.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Muss exakt der extern konfigurierten HTTPS-SPA-Origin entsprechen.
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: Spring-Security-CSRF-Token aus GET /access/csrf; nur im Arbeitsspeicher halten.
  responses:
    ExpenseUnavailable:
      description: Speicherung oder Lesen nicht bestätigt; neutraler Fehler, no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpenseError'
    BudgetUnavailable:
      description: Speicherung oder Lesen nicht bestätigt; neutraler Fehler, no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BudgetError'
    SessionCreated:
      description: Erst nach Commit; no-store. Set-Cookie rotiert __Host-tnbp-refresh (HttpOnly; Secure; SameSite=Strict; Path=/; kein Domain).
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'
    SessionRejected:
      description: Neutraler Fehler; Refreshfehler löschen Cookie. no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionError'
    SessionForbidden:
      description: CSRF oder Origin fehlt/falsch; keine Mutation. no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionError'
    SessionUnavailable:
      description: Keine bestätigte Mutation; eine unbestätigte Rotation nicht automatisch wiederholen. no-store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionError'
  schemas:
    ExpenseRequest:
      type: object
      additionalProperties: false
      required: [name, amountCents]
      properties:
        name:
          type: string
          minLength: 1
          description: Wird getrimmt; darf danach nicht leer sein.
        amountCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Positive ganze EUR-Cent; keine Rundung oder Typumwandlung.
    ExpenseResponse:
      type: object
      additionalProperties: false
      required: [id, name, amountCents, recordedOn]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        amountCents:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        recordedOn:
          type: string
          format: date
          description: Serverseitiges Kalenderdatum in Europe/Berlin ohne Zeitpunktumrechnung.
    ExpenseError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, MONTH_LIMIT_EXCEEDED, EXPENSE_UNAVAILABLE]
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    BudgetRequest:
      type: object
      additionalProperties: false
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Ganze EUR-Cent; Strings, Bruchteile und Überlauf werden ohne Rundung abgelehnt.
    BudgetResponse:
      type: object
      additionalProperties: false
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9007199254740991
    BudgetError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, BUDGET_UNAVAILABLE]
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          writeOnly: true
    SessionResponse:
      type: object
      additionalProperties: false
      required: [accessToken, expiresAt, userId]
      properties:
        accessToken:
          type: string
          description: HS256, externer Schlüssel, exakt zehn Minuten. Nur im Arbeitsspeicher.
        expiresAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
    SessionIdentity:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
    SessionError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [SESSION_REJECTED, SESSION_FORBIDDEN, SESSION_UNAVAILABLE]
        message:
          type: string

    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [registrationToken, email, password]
      description: E-Mail wird getrimmt und kleingeschrieben. Passwort wird ausschließlich NFC-normalisiert und in Unicode-Codepunkten geprüft (15–64); keine Zeichenklassenpflicht.
      properties:
        registrationToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Ungepaddetes Base64url-Geheimnis (256 Bit) aus dem URL-Fragment.
        email:
          type: string
          description: Gültige E-Mail-Syntax, nach Normalisierung höchstens 254 Zeichen.
        password:
          type: string
          writeOnly: true
          description: 15–64 druckbare Unicode-Codepunkte nach NFC; Leerzeichen erlaubt, kein Trimmen oder Abschneiden. Lokale Sperrliste.
    RegistrationCreated:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          example: Dein Konto wurde angelegt.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, REGISTRATION_FAILED, SERVER_ERROR]
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
